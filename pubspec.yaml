  animate_do: ^5.1.0
  installed_apps:
    git:
      url: https://github.com/raj457036/installed_apps.git
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  video_player: ^2.10.0
  emoji_picker_flutter:
    git:
      url: https://github.com/raj457036/emoji_picker_flutter.git
  purchases_flutter: ^10.1.0
  purchases_ui_flutter: ^10.1.0
  supabase_flutter: ^2.12.4
  supabase_auth_ui: ^0.5.5
  super_clipboard: ^0.9.1
  super_drag_and_drop: ^0.9.1
  easy_worker: ^1.2.3
  cacherine: ^1.1.4
  clipboard_watcher: ^0.3.0
  crypto: ^3.0.7
  mdns_dart: ^2.2.1
  ntp: ^2.0.0
  nanoid2: ^2.0.1
  tiny_storage: ^2.0.2
  share_plus: ^10.1.4
  device_info_plus: ^11.5.0
  equatable: ^2.0.8
  any_link_preview: ^3.0.3
  cached_network_svg_image: ^2.0.0
  cached_network_image: ^3.4.1
  synchronized: ^3.4.0
  archive: ^4.0.9
  statsfl: ^2.3.0
  open_dir: ^0.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  injectable_generator: ^2.7.0
  isar_community_generator: *isar_version
  freezed: ^2.5.8
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4
dependency_overrides:
  connectivity_plus: 7.0.0
  supabase_auth_ui:
    path: packages/supabase_auth_ui
  # irondash_engine_context:
  #   git:
  #     url: https://github.com/Sabbar-Engineering/irondash
  #     path: "engine_context/dart"

flutter:
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/icons/
    - fonts/

  fonts:
    - family: RobotoFlex
      fonts:
        - asset: fonts/RobotoFlex-VariableFont.ttf
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
    - family: DockIcons
      fonts:
        - asset: fonts/DockIcons.ttf
    - family: CustomIcons
      fonts:
        - asset: fonts/CustomIcons.ttf

flutter_launcher_icons:
  image_path: "./resources/icon_2026_flat.png"
  android: true
  adaptive_icon_background: "#262141"
  adaptive_icon_foreground: "./resources/icon_2026_adaptive_fg.png"
  adaptive_icon_monochrome: "./resources/icon_2026_monochrome_fg.png"
  min_sdk_android: 24

  ios: "./resources/icon_2026_ios.png"
  image_path_ios_dark_transparent: "./resources/icon_2026_rounded.png"
  remove_alpha_ios: true
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#262141"

  windows:
    generate: true
    icon_size: 256
    image_path: "./resources/icon_2026_flat.png"

  macos:
    generate: true
    image_path: "./resources/icon_2026_macos.png"
