  get_it: ^8.3.0
  go_router: ^17.2.3
  dartz: ^0.10.1
  form_validator: ^2.1.1
  window_manager: ^0.5.1
  timeago: ^3.7.1
  isar_community: *isar_version
  isar_community_flutter_libs: *isar_version
  uuid: ^4.5.3
  rxdart: ^0.28.0
  internet_connection_checker_plus: ^3.0.0
  url_launcher: ^6.3.2
  googleapis: ^16.0.0
  file_picker: ^11.0.2
  http: ^1.6.0
  blurhash_dart: ^1.2.1
  mime: ^2.0.0
  image: ^4.8.0
  intl: ^0.20.2
  app_links: ^7.0.0
  device_preview: ^1.2.0
  async: ^2.13.1
  win32_registry: ^2.1.0
  share_handler: ^0.0.25
  universal_io: ^2.3.1
  duration: ^4.0.3
  open_filex: ^4.7.0
  hotkey_manager: ^0.2.3
  focus_window:
    path: packages/focus_window
  quick_paste_popup:
    path: packages/quick_paste_popup
  package_info_plus: ^8.3.1
  tray_manager: ^0.5.2
  flutter_platform_alert: ^0.8.0
  device_preview_screenshot: ^1.0.0
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  upgrader: 13.1.0
  in_app_review: ^2.0.9
  retry: ^3.1.2
  launch_at_startup: ^0.5.1
  flutter_colorpicker: ^1.1.0
  flutter_svg: ^2.2.4
