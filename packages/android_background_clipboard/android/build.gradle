group = "com.entilitystudio.android_background_clipboard"
version = "1.0-SNAPSHOT"

def localProperties = new Properties()
def localPropertiesCandidates = [
    rootProject.file("local.properties"),
    rootProject.file("../../../android/local.properties"),
]
def localPropertiesFile = localPropertiesCandidates.find { it.exists() }
if (localPropertiesFile != null) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterSdkPath = System.getenv("FLUTTER_ROOT") ?: localProperties.getProperty("flutter.sdk")
if (flutterSdkPath == null) {
    throw new RuntimeException("Flutter SDK not found. Set FLUTTER_ROOT or define flutter.sdk in android/local.properties")
}

def engineVersionFile = new File(flutterSdkPath, "bin/internal/engine.version")
if (!engineVersionFile.exists()) {
    throw new RuntimeException("Unable to locate engine.version at ${engineVersionFile.path}")
}
def flutterEmbeddingVersion = "1.0.0-${engineVersionFile.text.trim()}"

buildscript {
    ext.kotlin_version = "1.9.23"
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.entilitystudio.android_background_clipboard"
    }

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:5.2.1"
    implementation 'com.squareup.okhttp3:logging-interceptor:5.2.1'
    implementation "com.aventrix.jnanoid:jnanoid:2.0.0"
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation "androidx.core:core-ktx:1.17.0"
    debugImplementation "io.flutter:flutter_embedding_debug:${flutterEmbeddingVersion}"
    releaseImplementation "io.flutter:flutter_embedding_release:${flutterEmbeddingVersion}"
}