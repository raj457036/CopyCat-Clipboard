name: Release macOS Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in X.X.X format
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos-main
  cancel-in-progress: false

jobs:
  build-macos-release:
    name: Build and Publish macOS Release
    runs-on: macos-14

    steps:
      - name: Validate release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $INPUT_TAG"
            echo "Expected format: X.X.X (example: 2.0.6)"
            exit 1
          fi

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inject production defines
        env:
          PROD_SECRETS: ${{ secrets.PROD_SECRETS }}
        run: |
          mkdir -p local
          printf '%s' "$PROD_SECRETS" > local/prod.json

      - name: Install Apple signing certificate and profile
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=""

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > cert.p12
          security import cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > \
            "$HOME/Library/MobileDevice/Provisioning Profiles/CopyCat.mobileprovision"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build macOS zip
        run: |
          flutter build macos --verbose \
            --tree-shake-icons \
            --dart-define-from-file=local/prod.json \
            --obfuscate \
            --split-debug-info=./build_symbols && \
          codesign --remove-signature \
            build/macos/Build/Products/Release/CopyCat.app || true && \
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/CopyCat.app \
            CopyCat-macOS.zip

      - name: Rename zip with version
        env:
          TAG_NAME: ${{ github.event.inputs.tag }}
        run: mv -f CopyCat-macOS.zip "CopyCat-macOS-${TAG_NAME}.zip"

      - name: Ensure git tag exists
        env:
          TAG_NAME: ${{ github.event.inputs.tag }}
        run: |
          git fetch --tags --force
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG_NAME"
          else
            git tag "$TAG_NAME" "$(git rev-parse HEAD)"
            git push origin "$TAG_NAME"
            echo "Created tag: $TAG_NAME"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag }}
        run: |
          ASSET_NAME="CopyCat-macOS-${TAG_NAME}.zip"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "CopyCat $TAG_NAME" --target "$(git rev-parse HEAD)"
            gh release upload "$TAG_NAME" "$ASSET_NAME" --clobber
            echo "Updated existing release: $TAG_NAME"
          else
            gh release create "$TAG_NAME" "$ASSET_NAME" \
              --title "CopyCat $TAG_NAME" \
              --target "$(git rev-parse HEAD)" \
              --generate-notes
            echo "Created new release: $TAG_NAME"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopyCat-macOS-${{ github.event.inputs.tag }}
          path: CopyCat-macOS-${{ github.event.inputs.tag }}.zip
          if-no-files-found: error

      - name: Cleanup local prod file
        if: always()
        run: rm -f local/prod.json
