name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROD_DART_DEFINES_SECRET: PROD_DART_DEFINES_JSON

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create local prod defines for CI
        run: |
          mkdir -p local
          if [ -n "${{ secrets[env.PROD_DART_DEFINES_SECRET] }}" ]; then
            printf '%s' "${{ secrets[env.PROD_DART_DEFINES_SECRET] }}" > local/prod.json
          else
            echo '{}' > local/prod.json
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
